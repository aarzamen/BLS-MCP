<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLS.ai Scenario Trainer</title>
<style>
/* ── Reset & Base ────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#0f1118;--bg3:#161b26;--border:#1e2a36;
  --cyan:#00e5ff;--cyan-dim:#00849a;--red:#ff1744;--red-dim:#7a1020;
  --amber:#ffab00;--amber-dim:#7a5500;--green:#00e676;--green-dim:#00703a;
  --text:#e0e6ed;--text-dim:#5a6577;--white:#eaf0f4;
  --mono:'SF Mono','Fira Code','JetBrains Mono','Cascadia Mono','Consolas',monospace;
  --sans:system-ui,-apple-system,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;overflow:hidden}

/* ── Scrollbar ───────────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── Keyframes ───────────────────────────────────────────── */
@keyframes pulse-current{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes heartbeat{0%,40%,100%{transform:scale(1)}10%{transform:scale(1.15)}25%{transform:scale(1.05)}}
@keyframes flatline{0%{background-position:0 50%}100%{background-position:200% 50%}}
@keyframes fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes glow-red{0%,100%{box-shadow:0 0 4px var(--red-dim)}50%{box-shadow:0 0 12px var(--red)}}
@keyframes chest-compress{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.92)}}
@keyframes pad-pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes scan{0%{left:-30%}100%{left:100%}}

/* ── Layout ──────────────────────────────────────────────── */
#app{display:grid;height:100vh;grid-template-rows:42px 1fr 38px auto;grid-template-columns:220px 1fr 260px;grid-template-areas:
  "header header header"
  "patient center algo"
  "patient actions algo"
  "timeline timeline timeline";
  gap:0;overflow:hidden}

/* ── Header ──────────────────────────────────────────────── */
#header{grid-area:header;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bg2);border-bottom:1px solid var(--border);position:relative;overflow:hidden}
#header::after{content:'';position:absolute;bottom:0;left:0;height:1px;width:30%;background:linear-gradient(90deg,var(--cyan),transparent);animation:scan 4s linear infinite}
#header h1{font-size:14px;font-weight:700;color:var(--cyan);letter-spacing:1.5px;text-transform:uppercase;font-family:var(--mono)}
.header-right{display:flex;align-items:center;gap:14px}
#elapsed-timer{font-size:15px;color:var(--amber);font-weight:700;letter-spacing:1px}
.status-badge{font-size:10px;padding:2px 8px;border-radius:3px;text-transform:uppercase;font-weight:700;letter-spacing:.8px}
.status-badge.active{background:var(--green-dim);color:var(--green);border:1px solid var(--green)}
.status-badge.completed{background:var(--cyan-dim);color:var(--white);border:1px solid var(--cyan)}
.status-badge.failed{background:var(--red-dim);color:var(--red);border:1px solid var(--red)}
.status-badge.paused{background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber)}

/* ── Patient Panel ───────────────────────────────────────── */
#patient{grid-area:patient;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-title{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-dim);padding:8px 12px 4px;border-bottom:1px solid var(--border)}
#patient-svg-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px}
#patient-svg-wrap svg{width:100%;max-height:100%;display:block}
#patient-info{padding:8px 12px;border-top:1px solid var(--border);font-size:11px;line-height:1.7}
#patient-info .label{color:var(--text-dim)}
#patient-info .value{color:var(--white);margin-left:4px}

/* ── Center Area ─────────────────────────────────────────── */
#center{grid-area:center;display:grid;grid-template-rows:auto 1fr;gap:0;overflow:hidden}

/* ── Vitals Panel ────────────────────────────────────────── */
#vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);border-bottom:1px solid var(--border)}
.vital-card{background:var(--bg2);padding:8px 10px;text-align:center;position:relative;transition:background .4s}
.vital-card.critical{background:rgba(255,23,68,.08)}
.vital-card.warning{background:rgba(255,171,0,.06)}
.vital-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:2px}
.vital-value{font-size:22px;font-weight:700;transition:color .4s;line-height:1.2}
.vital-value.critical{color:var(--red)}
.vital-value.warning{color:var(--amber)}
.vital-value.normal{color:var(--green)}
.vital-sub{font-size:9px;color:var(--text-dim);margin-top:1px}
.vital-value.has-pulse{animation:heartbeat 1s ease-in-out infinite}

/* ── Quality Metrics ─────────────────────────────────────── */
#metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--border);padding:0;border-bottom:1px solid var(--border)}
.metric-card{background:var(--bg2);padding:6px 10px;display:flex;flex-direction:column;align-items:center;gap:1px}
.metric-label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-dim)}
.metric-value{font-size:16px;font-weight:700;color:var(--cyan)}
.metric-value.good{color:var(--green)}
.metric-value.bad{color:var(--red)}

/* ── Algorithm Tracker ───────────────────────────────────── */
#algo{grid-area:algo;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#algo-list{flex:1;overflow-y:auto;padding:6px 10px}
.algo-step{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:11px;line-height:1.4;transition:opacity .3s}
.algo-step.upcoming{opacity:.4}
.algo-step.current{opacity:1}
.algo-step.completed{opacity:.7}
.algo-step.error{opacity:1}
.step-icon{flex-shrink:0;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:700;border:1.5px solid var(--border);color:var(--text-dim)}
.algo-step.completed .step-icon{border-color:var(--green);color:var(--green);background:rgba(0,230,118,.08)}
.algo-step.current .step-icon{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.12);animation:pulse-current 1.5s ease-in-out infinite}
.algo-step.error .step-icon{border-color:var(--red);color:var(--red);background:rgba(255,23,68,.1)}
.step-label{color:var(--text)}
.algo-step.upcoming .step-label{color:var(--text-dim)}
.algo-step.current .step-label{color:var(--cyan);font-weight:600}
.algo-step.error .step-label{color:var(--red)}

/* ── Branch indicator ────────────────────────────────────── */
.algo-branch{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--amber);padding:6px 0 2px 26px;opacity:.6}

/* ── Actions ─────────────────────────────────────────────── */
#actions{grid-area:actions;display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:6px 10px;background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow-x:auto}
.action-btn{font-family:var(--mono);font-size:11px;padding:5px 12px;border:1px solid var(--border);border-radius:4px;background:var(--bg3);color:var(--text);cursor:pointer;transition:all .15s;white-space:nowrap}
.action-btn:hover:not(:disabled){background:#1e2e3c;border-color:var(--cyan-dim);color:var(--white)}
.action-btn.recommended{border-color:var(--cyan);color:var(--cyan);background:rgba(0,229,255,.08);box-shadow:0 0 6px rgba(0,229,255,.15)}
.action-btn.recommended:hover{background:rgba(0,229,255,.18)}
.action-btn:disabled{opacity:.25;cursor:not-allowed}
.action-btn.completed-action{opacity:.3;text-decoration:line-through;cursor:default}

/* ── Timeline ────────────────────────────────────────────── */
#timeline{grid-area:timeline;background:var(--bg2);border-top:1px solid var(--border);display:flex;flex-direction:column;max-height:130px}
#timeline .panel-title{flex-shrink:0}
#timeline-list{flex:1;overflow-y:auto;padding:4px 12px 6px;display:flex;flex-direction:column;gap:2px}
.tl-entry{display:flex;gap:8px;font-size:11px;animation:fade-in .3s ease;line-height:1.5}
.tl-time{color:var(--text-dim);flex-shrink:0;min-width:48px;text-align:right}
.tl-icon{flex-shrink:0;width:14px;text-align:center}
.tl-icon.correct{color:var(--green)}
.tl-icon.incorrect{color:var(--red)}
.tl-icon.info{color:var(--amber)}
.tl-desc{color:var(--text)}

/* ── Errors / Good Calls ─────────────────────────────────── */
#feedback-bar{position:fixed;top:46px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.feedback-toast{padding:4px 14px;border-radius:4px;font-size:11px;font-weight:600;animation:fade-in .25s ease;pointer-events:none}
.feedback-toast.error{background:var(--red-dim);color:var(--red);border:1px solid var(--red)}
.feedback-toast.good{background:rgba(0,230,118,.12);color:var(--green);border:1px solid var(--green)}

/* ── Demo banner ─────────────────────────────────────────── */
#demo-banner{display:none;position:fixed;top:46px;right:14px;font-size:9px;text-transform:uppercase;letter-spacing:1px;padding:2px 8px;border-radius:3px;background:var(--amber-dim);color:var(--amber);border:1px solid var(--amber);z-index:50}
body.demo-mode #demo-banner{display:block}

/* ── Tab Toggle ─────────────────────────────────────────── */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border)}
.tab-btn{font-family:var(--mono);font-size:10px;padding:6px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text-dim);cursor:pointer;text-transform:uppercase;letter-spacing:.8px;transition:all .15s}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--cyan);border-bottom-color:var(--cyan)}

/* ── History Panel ──────────────────────────────────────── */
#history-panel{display:none;grid-area:center;background:var(--bg);overflow-y:auto;padding:0}
#history-panel.visible{display:block}
.history-list{display:flex;flex-direction:column;gap:1px;background:var(--border)}
.history-entry{background:var(--bg2);padding:8px 12px;cursor:pointer;transition:background .15s;display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center}
.history-entry:hover{background:var(--bg3)}
.history-entry .he-header{display:flex;gap:10px;align-items:center;font-size:11px}
.history-entry .he-date{color:var(--text-dim);min-width:80px}
.history-entry .he-type{color:var(--cyan)}
.history-entry .he-student{color:var(--text-dim)}
.history-entry .he-grade{font-size:10px;font-weight:700;padding:1px 6px;border-radius:2px}
.he-grade.Competent{color:var(--green);background:rgba(0,230,118,.1)}
.he-grade.Needs{color:var(--amber);background:rgba(255,171,0,.1)}
.he-grade.Specific{color:var(--red);background:rgba(255,23,68,.1)}
.history-entry .he-metrics{display:flex;gap:12px;font-size:10px;color:var(--text-dim);margin-top:3px}
.he-metrics span{color:var(--cyan)}
.history-detail{display:none;background:var(--bg);padding:8px 12px;border-left:2px solid var(--cyan);margin-left:8px;font-size:11px}
.history-detail.visible{display:block}
.history-detail h4{color:var(--cyan);font-size:10px;text-transform:uppercase;margin:6px 0 3px}
.history-detail .hd-tl{color:var(--text-dim);padding:1px 0}

/* ── Audio Controls ─────────────────────────────────────── */
#audio-toggle{font-family:var(--mono);font-size:10px;padding:2px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg3);color:var(--text-dim);cursor:pointer;transition:all .15s}
#audio-toggle:hover{border-color:var(--cyan-dim)}
#audio-toggle.muted{color:var(--red);border-color:var(--red-dim)}

/* ── Scanline Overlay ─────────────────────────────────── */
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.06) 2px,rgba(0,0,0,.06) 4px);
  mix-blend-mode:multiply}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.35) 100%);
  mix-blend-mode:multiply}

/* ── Sparkline ────────────────────────────────────────── */
.vital-spark{display:block;height:16px;margin-top:2px}
.vital-spark polyline{stroke-width:1.2;fill:none;stroke-linejoin:round;stroke-linecap:round}

/* ── Visual Metronome Bar ─────────────────────────────── */
#metronome-bar{display:none;position:fixed;bottom:0;left:0;right:0;height:4px;z-index:200;background:var(--bg)}
#metronome-bar.active{display:block}
#metronome-fill{height:100%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);transition:width .1s linear;width:0}
@keyframes metronome-pulse{0%{width:0}50%{width:100%}100%{width:0}}
#metronome-bar.active #metronome-fill{animation:metronome-pulse 0.545s ease-in-out infinite}

/* ── Carotid Pulse Point ──────────────────────────────── */
@keyframes carotid-pulse{0%,100%{r:3;opacity:.6}50%{r:5;opacity:1}}
.carotid-active{animation:carotid-pulse 1s ease-in-out infinite}

/* ── Debrief View ─────────────────────────────────────── */
#debrief-panel{display:none;grid-column:1/-1;grid-row:2/5;background:var(--bg);overflow-y:auto;padding:20px;z-index:10}
#debrief-panel.visible{display:block}
.debrief-grade{text-align:center;padding:24px 0 16px}
.debrief-grade .grade-badge{display:inline-block;font-size:28px;font-weight:700;padding:12px 32px;border-radius:6px;letter-spacing:2px;text-transform:uppercase}
.grade-badge.Competent{color:var(--green);border:2px solid var(--green);background:rgba(0,230,118,.06);box-shadow:0 0 20px rgba(0,230,118,.15)}
.grade-badge.NeedsPractice{color:var(--amber);border:2px solid var(--amber);background:rgba(255,171,0,.06);box-shadow:0 0 20px rgba(255,171,0,.15)}
.grade-badge.SpecificDeficiency{color:var(--red);border:2px solid var(--red);background:rgba(255,23,68,.06);box-shadow:0 0 20px rgba(255,23,68,.15)}
.debrief-sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:16px}
.debrief-section{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px}
.debrief-section h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin-bottom:10px}
.debrief-metric-bar{margin:6px 0}
.debrief-metric-bar .bar-label{font-size:10px;color:var(--text-dim);display:flex;justify-content:space-between;margin-bottom:3px}
.debrief-metric-bar .bar-track{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.debrief-metric-bar .bar-fill{height:100%;border-radius:4px;transition:width .6s ease}
.debrief-list{list-style:none;padding:0}
.debrief-list li{font-size:11px;padding:3px 0;border-bottom:1px solid var(--border)}
.debrief-list li:last-child{border-bottom:none}
.debrief-list li::before{margin-right:6px;font-size:9px}
.debrief-list.good li::before{content:'✓';color:var(--green)}
.debrief-list.bad li::before{content:'✗';color:var(--red)}
.debrief-list.teach li::before{content:'→';color:var(--cyan)}
.debrief-actions{text-align:center;margin-top:20px;display:flex;gap:12px;justify-content:center}
.debrief-btn{font-family:var(--mono);font-size:12px;padding:8px 20px;border:1px solid var(--cyan);border-radius:4px;background:rgba(0,229,255,.08);color:var(--cyan);cursor:pointer;transition:all .15s}
.debrief-btn:hover{background:rgba(0,229,255,.18)}

/* ── Student Progress View ────────────────────────────── */
#progress-panel{display:none;grid-column:1/-1;grid-row:2/5;background:var(--bg);overflow-y:auto;padding:20px;z-index:10}
#progress-panel.visible{display:block}
.progress-header{text-align:center;margin-bottom:20px}
.progress-header h2{color:var(--cyan);font-size:16px;text-transform:uppercase;letter-spacing:2px}
.progress-stats{display:flex;gap:20px;justify-content:center;margin:12px 0}
.progress-stat{text-align:center}
.progress-stat .stat-val{font-size:24px;font-weight:700;color:var(--cyan)}
.progress-stat .stat-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim)}
.progress-charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:14px}
.chart-card h3{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--cyan);margin-bottom:10px}
.chart-card svg{width:100%;display:block}
.weak-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.weak-tag{font-size:10px;padding:2px 8px;border-radius:3px;background:rgba(255,23,68,.1);color:var(--red);border:1px solid var(--red-dim)}
</style>
</head>
<body>

<div id="app">

  <!-- ── Header ─────────────────────────────────────────── -->
  <header id="header">
    <h1>BLS.ai Scenario Trainer</h1>
    <div class="header-right">
      <button id="audio-toggle" onclick="toggleAudio()" title="Toggle AED audio and metronome">SND ON</button>
      <span id="elapsed-timer">00:00</span>
      <span id="status-badge" class="status-badge active">ACTIVE</span>
    </div>
  </header>

  <!-- ── Patient Panel ──────────────────────────────────── -->
  <section id="patient">
    <div class="panel-title">Patient</div>
    <div id="patient-svg-wrap"></div>
    <div id="patient-info"></div>
  </section>

  <!-- ── Center: Vitals + Metrics + History ────────────── -->
  <section id="center">
    <div class="tab-bar">
      <button class="tab-btn active" id="tab-scenario" onclick="switchTab('scenario')">Active Scenario</button>
      <button class="tab-btn" id="tab-history" onclick="switchTab('history')">History</button>
    </div>
    <div id="scenario-panel">
      <div id="vitals"></div>
      <div id="metrics"></div>
    </div>
    <div id="history-panel"></div>
  </section>

  <!-- ── Algorithm Tracker ──────────────────────────────── -->
  <aside id="algo">
    <div class="panel-title">BLS Algorithm</div>
    <div id="algo-list"></div>
  </aside>

  <!-- ── Actions ────────────────────────────────────────── -->
  <div id="actions"></div>

  <!-- ── Timeline ───────────────────────────────────────── -->
  <section id="timeline">
    <div class="panel-title">Event Log</div>
    <div id="timeline-list"></div>
  </section>

</div>

<div id="feedback-bar"></div>
<div id="demo-banner">DEMO MODE</div>
<div id="metronome-bar"><div id="metronome-fill"></div></div>
<div id="debrief-panel"></div>
<div id="progress-panel"></div>

<script>
// ═══════════════════════════════════════════════════════════
//  BLS.ai Dashboard – self-contained UI
// ═══════════════════════════════════════════════════════════

// ── Action label map ────────────────────────────────────
const ACTION_LABELS = {
  check_scene_safety:      'Check Scene Safety',
  check_responsiveness:    'Check Responsiveness',
  activate_ems:            'Activate EMS',
  request_aed:             'Request AED',
  check_pulse_breathing:   'Check Pulse & Breathing',
  start_compressions:      'Start Compressions',
  open_airway:             'Open Airway',
  give_breaths:            'Give Breaths',
  apply_aed:               'Apply AED',
  analyze_rhythm:          'Analyze Rhythm',
  deliver_shock:           'Deliver Shock',
  resume_cpr:              'Resume CPR',
  switch_compressor:       'Switch Compressor',
  establish_iv:            'Establish IV/IO',
  give_epinephrine:        'Give Epinephrine',
  give_amiodarone:         'Give Amiodarone',
  advanced_airway:         'Advanced Airway',
  check_rhythm:            'Check Rhythm (2min)',
  rosc_assessment:         'Assess for ROSC',
  post_rosc_care:          'Post-ROSC Care',
  administer_naloxone:     'Give Naloxone',
  apply_bvm:               'Apply BVM',
  suction_airway:          'Suction Airway',
  recovery_position:       'Recovery Position',
  head_tilt_chin_lift:     'Head-Tilt Chin-Lift',
  jaw_thrust:              'Jaw Thrust'
};

// ── BLS algorithm step definitions ──────────────────────
const ALGO_STEPS_LINEAR = [
  { id: 'scene_safety',        label: 'Scene Safety' },
  { id: 'responsiveness',      label: 'Check Responsiveness' },
  { id: 'activate_ems',        label: 'Activate EMS / Request AED' },
  { id: 'pulse_breathing_check', label: 'Check Pulse & Breathing' }
];
const ALGO_CARDIAC = [
  { id: 'cpr_in_progress',  label: 'CPR (30:2)' },
  { id: 'aed_applied',      label: 'AED Applied' },
  { id: 'rhythm_analysis',  label: 'Rhythm Analysis' },
  { id: 'shock_delivered',  label: 'Shock Delivered' },
  { id: 'cpr_post_shock',   label: 'CPR Post-Shock' },
  { id: 'rhythm_check',     label: 'Rhythm Check (2 min)' }
];
const ALGO_RESPIRATORY = [
  { id: 'pulse_no_breathing', label: 'Pulse Present / No Breathing' },
  { id: 'rescue_breathing', label: 'Rescue Breathing (1 per 5-6s)' },
  { id: 'rescue_breathing_reassess', label: 'Reassess (2 min)' }
];
const ALGO_TERMINAL = [
  { id: 'rosc',            label: 'ROSC Achieved' },
  { id: 'post_rosc_care',  label: 'Post-ROSC Care' }
];

// ── State ───────────────────────────────────────────────
let currentState = null;
let startTimestamp = null;
let timerInterval = null;
let demoMode = false;
let previousErrors = [];
let previousGoodCalls = [];
// Sparkline history: last 20 data points per vital
const sparkHistory = { hr: [], bp: [], spo2: [], gcs: [] };

// ── Communication ───────────────────────────────────────
window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'context_update') {
    demoMode = false;
    document.body.classList.remove('demo-mode');
    updateDashboard(event.data.state);
  }
});

function sendAction(action) {
  if (!currentState) return;
  window.parent.postMessage({
    type: 'tool_call',
    tool: 'submit_action',
    args: {
      case_id: currentState.case_id,
      action: action,
      timestamp_sec: getElapsedSeconds()
    }
  }, '*');
}

function getElapsedSeconds() {
  if (currentState && currentState.elapsed_sec != null) return currentState.elapsed_sec;
  if (!startTimestamp) return 0;
  return Math.floor((Date.now() - startTimestamp) / 1000);
}

// ── Timer ───────────────────────────────────────────────
function startTimer() {
  if (timerInterval) return;
  if (!startTimestamp) startTimestamp = Date.now();
  timerInterval = setInterval(() => {
    const el = document.getElementById('elapsed-timer');
    if (!el) return;
    let sec = getElapsedSeconds();
    if (currentState && currentState.elapsed_sec != null) {
      sec = currentState.elapsed_sec + Math.floor((Date.now() - (currentState._receivedAt || Date.now())) / 1000);
    }
    el.textContent = fmtTime(sec);
  }, 250);
}

function fmtTime(sec) {
  const m = String(Math.floor(sec / 60)).padStart(2, '0');
  const s = String(sec % 60).padStart(2, '0');
  return m + ':' + s;
}

// ═══════════════════════════════════════════════════════════
//  Render helpers
// ═══════════════════════════════════════════════════════════

function updateDashboard(state) {
  if (!state) return;
  state._receivedAt = Date.now();
  const prev = currentState;
  currentState = state;

  if (!startTimestamp && state.elapsed_sec != null) {
    startTimestamp = Date.now() - state.elapsed_sec * 1000;
  }
  startTimer();

  renderHeader(state);
  renderPatient(state);
  renderVitals(state);
  renderMetrics(state);
  renderAlgo(state);
  renderActions(state);
  renderTimeline(state);
  showFeedback(state, prev);
}

// ── Header ──────────────────────────────────────────────
function renderHeader(s) {
  document.getElementById('elapsed-timer').textContent = fmtTime(s.elapsed_sec || 0);
  const badge = document.getElementById('status-badge');
  badge.textContent = (s.status || 'active').toUpperCase();
  badge.className = 'status-badge ' + (s.status || 'active');
}

// ── Patient SVG ─────────────────────────────────────────
function renderPatient(s) {
  const wrap = document.getElementById('patient-svg-wrap');
  const step = s.bls_step || '';
  const isCompressing = ['cpr_in_progress','cpr_post_shock'].includes(step) ||
    (s.valid_actions && (s.valid_actions.includes('start_compressions') === false) &&
     s.timeline && s.timeline.some(e => e.action === 'start_compressions'));
  const compressing = ['cpr_in_progress','cpr_post_shock'].includes(step);
  const aedApplied = ['aed_applied','rhythm_analysis','shock_delivered','cpr_post_shock','rhythm_check','rosc','post_rosc_care'].includes(step)
    || (s.timeline && s.timeline.some(e => e.action === 'apply_aed'));
  const airwayManaged = s.timeline && s.timeline.some(e => ['open_airway','advanced_airway'].includes(e.action));
  const skin = s.vitals ? s.vitals.skin : '';
  const spo2 = s.vitals ? (s.vitals.spo2 || 0) : 0;
  // SpO2-based cyanosis: lower SpO2 = more blue/gray
  const skinColor = spo2 === 0 ? '#3a4a6a' : spo2 < 70 ? '#4a5a7a' : spo2 < 85 ? '#5a6a8a' : spo2 < 94 ? '#6a8898' : '#7a9aa8';
  const checkingPulse = step === 'pulse_breathing_check' || step === 'rescue_breathing_reassess';

  wrap.innerHTML = buildPatientSVG(skinColor, compressing, aedApplied, airwayManaged, checkingPulse);

  // Demographics
  const info = document.getElementById('patient-info');
  if (s.patient) {
    const p = s.patient;
    info.innerHTML =
      '<div><span class="label">Age:</span><span class="value">' + p.age + '</span></div>' +
      '<div><span class="label">Sex:</span><span class="value">' + p.sex + '</span></div>' +
      '<div><span class="label">Wt:</span><span class="value">' + p.weight_kg + ' kg</span></div>' +
      '<div><span class="label">PMH:</span><span class="value">' + esc(p.history || 'None') + '</span></div>' +
      (s.vitals ? '<div><span class="label">Skin:</span><span class="value">' + esc(s.vitals.skin || '—') + '</span></div>' +
      '<div><span class="label">Pupils:</span><span class="value">' + esc(s.vitals.pupils || '—') + '</span></div>' : '');
  }
}

// ── Vitals ──────────────────────────────────────────────
function renderVitals(s) {
  const v = s.vitals || {};
  // Track sparkline history
  if (v.hr != null) { sparkHistory.hr.push(v.hr); if (sparkHistory.hr.length > 20) sparkHistory.hr.shift(); }
  if (v.bp_systolic != null) { sparkHistory.bp.push(v.bp_systolic); if (sparkHistory.bp.length > 20) sparkHistory.bp.shift(); }
  if (v.spo2 != null) { sparkHistory.spo2.push(v.spo2); if (sparkHistory.spo2.length > 20) sparkHistory.spo2.shift(); }
  if (v.gcs != null) { sparkHistory.gcs.push(v.gcs); if (sparkHistory.gcs.length > 20) sparkHistory.gcs.shift(); }

  const vitals = [
    { label: 'HR', value: v.hr != null ? v.hr : '—', unit: 'bpm',
      cls: vitalClass(v.hr, [60, 100], [40, 150]),
      pulse: v.hr > 0, spark: sparkHistory.hr },
    { label: 'BP', value: v.bp_systolic != null ? v.bp_systolic + '/' + v.bp_diastolic : '—', unit: 'mmHg',
      cls: vitalClass(v.bp_systolic, [90, 140], [70, 180]), spark: sparkHistory.bp },
    { label: 'SpO2', value: v.spo2 != null ? v.spo2 : '—', unit: '%',
      cls: vitalClass(v.spo2, [94, 100], [88, 100]), spark: sparkHistory.spo2 },
    { label: 'Rhythm', value: v.rhythm || s.rhythm || '—', unit: '',
      cls: rhythmClass(v.rhythm || s.rhythm), spark: null },
    { label: 'GCS', value: v.gcs != null ? v.gcs : '—', unit: '/15',
      cls: vitalClass(v.gcs, [13, 15], [9, 15]), spark: sparkHistory.gcs }
  ];

  const el = document.getElementById('vitals');
  el.innerHTML = vitals.map(vt => {
    const cardCls = vt.cls === 'critical' ? ' critical' : vt.cls === 'warning' ? ' warning' : '';
    const pulseCls = vt.pulse ? ' has-pulse' : '';
    const sparkSvg = vt.spark && vt.spark.length > 1 ? buildSparkline(vt.spark, vt.cls) : '';
    return '<div class="vital-card' + cardCls + '">' +
      '<div class="vital-label">' + vt.label + '</div>' +
      '<div class="vital-value ' + vt.cls + pulseCls + '">' + vt.value + '</div>' +
      '<div class="vital-sub">' + vt.unit + '</div>' +
      sparkSvg +
      '</div>';
  }).join('');
}

function buildSparkline(data, cls) {
  if (data.length < 2) return '';
  const w = 60, h = 16;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 2) - 1;
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const color = cls === 'critical' ? 'var(--red)' : cls === 'warning' ? 'var(--amber)' : 'var(--green)';
  return '<svg class="vital-spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<polyline points="' + points + '" stroke="' + color + '" opacity=".6"/></svg>';
}

function vitalClass(val, normalRange, warnRange) {
  if (val == null || val === '—') return 'critical';
  if (val === 0 && normalRange[0] > 0) return 'critical';
  if (val >= normalRange[0] && val <= normalRange[1]) return 'normal';
  if (val >= warnRange[0] && val <= warnRange[1]) return 'warning';
  return 'critical';
}

function rhythmClass(r) {
  if (!r) return 'critical';
  const crit = ['VFib','VTach','Asystole','PEA','Pulseless VT'];
  const warn = ['SVT','AFib','AFlutter','Bradycardia'];
  if (crit.some(c => r.toLowerCase().includes(c.toLowerCase()))) return 'critical';
  if (warn.some(c => r.toLowerCase().includes(c.toLowerCase()))) return 'warning';
  return 'normal';
}

// ── Metrics ─────────────────────────────────────────────
function renderMetrics(s) {
  const m = s.metrics || {};
  const items = [
    { label: 'Compression %', value: m.compression_fraction != null ? Math.round(m.compression_fraction) + '%' : '—',
      cls: m.compression_fraction >= 60 ? 'good' : m.compression_fraction > 0 ? 'bad' : '' },
    { label: 'CPR Cycles', value: m.cpr_cycle_count != null ? m.cpr_cycle_count : '—', cls: '' },
    { label: 'Shocks', value: m.shock_count != null ? m.shock_count : '—', cls: '' },
    { label: 'Epi Doses', value: m.epi_doses != null ? m.epi_doses : '—', cls: '' },
    { label: 'Pause Time', value: m.total_pause_duration != null ? m.total_pause_duration + 's' : '—',
      cls: m.total_pause_duration > 10 ? 'bad' : '' },
    { label: '1st Compress', value: m.time_to_first_compression != null ? m.time_to_first_compression + 's' : '—',
      cls: m.time_to_first_compression != null ? (m.time_to_first_compression <= 60 ? 'good' : 'bad') : '' }
  ];

  document.getElementById('metrics').innerHTML = items.map(i =>
    '<div class="metric-card">' +
    '<span class="metric-label">' + i.label + '</span>' +
    '<span class="metric-value ' + i.cls + '">' + i.value + '</span>' +
    '</div>'
  ).join('');
}

// ── Algorithm Tracker ───────────────────────────────────
function renderAlgo(s) {
  const step = s.bls_step || '';
  const completedActions = (s.timeline || []).map(e => e.action);

  // Determine which path to show
  const isCardiac = ['cpr_in_progress','aed_applied','rhythm_analysis','shock_delivered','cpr_post_shock','rhythm_check'].includes(step)
    || completedActions.some(a => ['start_compressions','apply_aed'].includes(a));
  const isRespiratory = ['pulse_no_breathing','rescue_breathing','rescue_breathing_reassess'].includes(step)
    || completedActions.includes('administer_naloxone');
  const isROSC = ['rosc','post_rosc_care'].includes(step);

  // Map bls_step to step IDs for status
  const completedSteps = new Set();
  const errorSteps = new Set();
  const stepActionMap = {
    'scene_safety': ['check_scene_safety'],
    'responsiveness': ['check_responsiveness'],
    'activate_ems': ['activate_ems','request_aed'],
    'pulse_breathing_check': ['check_pulse_breathing'],
    'cpr_in_progress': ['start_compressions','resume_cpr'],
    'aed_applied': ['apply_aed'],
    'rhythm_analysis': ['analyze_rhythm'],
    'shock_delivered': ['deliver_shock'],
    'cpr_post_shock': ['resume_cpr'],
    'rhythm_check': ['check_rhythm'],
    'pulse_no_breathing': ['check_pulse_breathing'],
    'rescue_breathing': ['give_breaths','apply_bvm','administer_naloxone','open_airway'],
    'rescue_breathing_reassess': ['check_pulse_breathing'],
    'rosc': ['rosc_assessment'],
    'post_rosc_care': ['post_rosc_care']
  };

  // Find completed steps
  const allSteps = [...ALGO_STEPS_LINEAR, ...ALGO_CARDIAC, ...ALGO_RESPIRATORY, ...ALGO_TERMINAL];
  const stepOrder = allSteps.map(st => st.id);
  const currentIdx = stepOrder.indexOf(step);

  for (const st of allSteps) {
    const actions = stepActionMap[st.id] || [];
    if (completedActions.some(a => actions.includes(a))) {
      completedSteps.add(st.id);
    }
  }

  // Check for errors on steps
  (s.errors || []).forEach(err => {
    for (const st of allSteps) {
      if (err.toLowerCase().includes(st.label.toLowerCase())) {
        errorSteps.add(st.id);
      }
    }
  });

  let html = '';

  function renderStep(st) {
    let status = 'upcoming';
    let icon = '\u25CB'; // ○
    if (st.id === step) { status = 'current'; icon = '\u25BA'; } // ►
    else if (completedSteps.has(st.id)) { status = 'completed'; icon = '\u2713'; } // ✓
    if (errorSteps.has(st.id)) { status = 'error'; icon = '\u2717'; } // ✗
    return '<div class="algo-step ' + status + '">' +
      '<span class="step-icon">' + icon + '</span>' +
      '<span class="step-label">' + st.label + '</span></div>';
  }

  ALGO_STEPS_LINEAR.forEach(st => { html += renderStep(st); });

  if (isCardiac || !isRespiratory) {
    html += '<div class="algo-branch">Cardiac Arrest Path</div>';
    ALGO_CARDIAC.forEach(st => { html += renderStep(st); });
  }
  if (isRespiratory) {
    html += '<div class="algo-branch">Respiratory Path</div>';
    ALGO_RESPIRATORY.forEach(st => { html += renderStep(st); });
  }

  if (isROSC || isCardiac || isRespiratory) {
    html += '<div class="algo-branch">Outcome</div>';
    ALGO_TERMINAL.forEach(st => { html += renderStep(st); });
  }

  document.getElementById('algo-list').innerHTML = html;
}

// ── Action Buttons ──────────────────────────────────────
function renderActions(s) {
  const valid = new Set(s.valid_actions || []);
  const recommended = new Set(s.recommended_actions || []);
  const completedActions = new Set((s.timeline || []).map(e => e.action));
  const el = document.getElementById('actions');

  // Show all action labels but only enable valid ones
  const allActions = Object.keys(ACTION_LABELS);
  // Filter to show: valid + recommended + recently completed (for context)
  const toShow = allActions.filter(a => valid.has(a) || recommended.has(a));

  if (toShow.length === 0 && s.status !== 'completed') {
    el.innerHTML = '<span style="color:var(--text-dim);font-size:11px;padding:4px">Waiting for state update\u2026</span>';
    return;
  }
  if (s.status === 'completed') {
    el.innerHTML = '<span style="color:var(--green);font-size:11px;padding:4px;font-weight:600">Scenario Complete</span>';
    return;
  }

  el.innerHTML = toShow.map(a => {
    const isValid = valid.has(a);
    const isRec = recommended.has(a);
    const isDone = completedActions.has(a) && !isValid;
    let cls = 'action-btn';
    if (isRec && isValid) cls += ' recommended';
    if (isDone) cls += ' completed-action';
    const disabled = (!isValid || isDone) ? ' disabled' : '';
    return '<button class="' + cls + '"' + disabled +
      ' onclick="sendAction(\'' + a + '\')">' +
      ACTION_LABELS[a] + '</button>';
  }).join('');
}

// ── Timeline ────────────────────────────────────────────
function renderTimeline(s) {
  const list = document.getElementById('timeline-list');
  const entries = s.timeline || [];

  list.innerHTML = entries.map(e => {
    const evalCls = e.evaluation === 'correct' ? 'correct' :
                    e.evaluation === 'incorrect' ? 'incorrect' : 'info';
    const icon = e.evaluation === 'correct' ? '\u2713' :
                 e.evaluation === 'incorrect' ? '\u2717' : '\u2022';
    return '<div class="tl-entry">' +
      '<span class="tl-time">' + fmtTime(e.timestamp_sec || 0) + '</span>' +
      '<span class="tl-icon ' + evalCls + '">' + icon + '</span>' +
      '<span class="tl-desc">' + esc(e.description || ACTION_LABELS[e.action] || e.action) +
      (e.notes ? ' <span style="color:var(--text-dim)">(' + esc(e.notes) + ')</span>' : '') +
      '</span></div>';
  }).join('');

  list.scrollTop = list.scrollHeight;
}

// ── Feedback Toasts ─────────────────────────────────────
function showFeedback(s, prev) {
  const bar = document.getElementById('feedback-bar');
  const newErrors = (s.errors || []).filter(e => !(previousErrors).includes(e));
  const newGood = (s.good_calls || []).filter(e => !(previousGoodCalls).includes(e));
  previousErrors = s.errors || [];
  previousGoodCalls = s.good_calls || [];

  newErrors.forEach(e => addToast(bar, e, 'error'));
  newGood.forEach(e => addToast(bar, e, 'good'));
}

function addToast(bar, text, type) {
  const t = document.createElement('div');
  t.className = 'feedback-toast ' + type;
  t.textContent = text;
  bar.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .4s'; }, 3000);
  setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 3500);
}

// ── Utility ─────────────────────────────────────────────
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ═══════════════════════════════════════════════════════════
//  Tab Switching
// ═══════════════════════════════════════════════════════════

function switchTab(tab) {
  document.getElementById('tab-scenario').classList.toggle('active', tab === 'scenario');
  document.getElementById('tab-history').classList.toggle('active', tab === 'history');
  document.getElementById('scenario-panel').style.display = tab === 'scenario' ? '' : 'none';
  document.getElementById('history-panel').style.display = tab === 'history' ? 'block' : 'none';
  if (tab === 'history') loadHistory();
}

// ═══════════════════════════════════════════════════════════
//  History Panel
// ═══════════════════════════════════════════════════════════

let historyData = [];

function loadHistory() {
  // Request history from server via postMessage
  window.parent.postMessage({ type: 'tool_call', tool: 'search_scenarios', args: { top_k: 50 } }, '*');
  // Also listen for history_data responses
}

window.addEventListener('message', (event) => {
  if (event.data && event.data.type === 'history_data') {
    historyData = event.data.scenarios || [];
    renderHistory();
  }
});

function renderHistory() {
  const panel = document.getElementById('history-panel');
  if (historyData.length === 0) {
    panel.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim)">No completed scenarios found</div>';
    return;
  }

  let html = '<div class="history-list">';
  historyData.forEach((s, idx) => {
    const date = new Date(s.date).toLocaleDateString() + ' ' + new Date(s.date).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const gradeClass = s.grade === 'Competent' ? 'Competent' : s.grade === 'Needs Practice' ? 'Needs' : 'Specific';
    const km = s.key_metrics || {};
    html += '<div class="history-entry" onclick="toggleHistoryDetail(' + idx + ')">' +
      '<div>' +
      '<div class="he-header">' +

// ═══════════════════════════════════════════════════════════
//  AED Audio Cues & Compression Metronome
// ═══════════════════════════════════════════════════════════

let audioEnabled = true;
let audioCtx = null;
let metronomeInterval = null;
let lastAudioStep = null;

function toggleAudio() {
  audioEnabled = !audioEnabled;
  const btn = document.getElementById('audio-toggle');
  btn.textContent = audioEnabled ? 'SND ON' : 'SND OFF';
  btn.classList.toggle('muted', !audioEnabled);
  if (!audioEnabled) stopMetronome();
}

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playClick() {
  if (!audioEnabled) return;
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.value = 800;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.05);
  } catch (e) { /* ignore audio errors */ }
}

function startMetronome() {
  if (metronomeInterval) return;
  // 110 BPM = ~545ms interval
  metronomeInterval = setInterval(playClick, 545);
}

function stopMetronome() {
  if (metronomeInterval) {
    clearInterval(metronomeInterval);
    metronomeInterval = null;
  }
}

function speakAED(text) {
  if (!audioEnabled) return;
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.9;
  u.pitch = 0.8;
  u.volume = 0.8;
  window.speechSynthesis.speak(u);
}

// Trigger audio based on BLS step changes
function handleAudioForStep(state) {
  if (!state) return;
  const step = state.bls_step;
  if (step === lastAudioStep) return;
  lastAudioStep = step;

  // Metronome during compressions (audio + visual bar)
  const compressing = ['cpr_in_progress', 'cpr_post_shock'].includes(step);
  const metroBar = document.getElementById('metronome-bar');
  if (compressing) {
    startMetronome();
    if (metroBar) metroBar.classList.add('active');
  } else {
    stopMetronome();
    if (metroBar) metroBar.classList.remove('active');
  }

  // AED voice prompts
  switch (step) {
    case 'aed_applied':
      speakAED('AED connected. Do not touch the patient. Analyzing rhythm.');
      break;
    case 'rhythm_analysis':
      const rhythm = state.vitals ? state.vitals.rhythm : '';
      const shockable = ['VFib','pVT','vfib','pvt'].some(r => (rhythm || '').toLowerCase().includes(r.toLowerCase()));
      if (shockable) {
        speakAED('Shock advised. Charging. Stand clear.');
      } else {
        speakAED('No shock advised. Resume CPR.');
      }
      break;
    case 'shock_delivered':
      speakAED('Shock delivered. Resume CPR immediately.');
      break;
    case 'rosc':
      speakAED('Check for signs of circulation.');
      break;
  }
}

// Hook audio into dashboard updates
const _origUpdateDashboard = updateDashboard;
updateDashboard = function(state) {
  _origUpdateDashboard(state);
  handleAudioForStep(state);
};

function showDebrief(debrief) {
  if (!debrief) return;
  const panel = document.getElementById('debrief-panel');
  const gradeClass = debrief.grade === 'Competent' ? 'Competent' :
    debrief.grade === 'Needs Practice' ? 'NeedsPractice' : 'SpecificDeficiency';
  const m = debrief.quality_metrics || {};
  const cf = m.compression_fraction != null ? Math.round(m.compression_fraction * 100) : 0;
  const ttfc = m.time_to_first_compression != null ? m.time_to_first_compression : null;

  let html = '<div class="debrief-grade">' +
    '<div class="grade-badge ' + gradeClass + '">' + esc(debrief.grade) + '</div>' +
    '<div style="color:var(--text-dim);margin-top:8px;font-size:12px">Outcome: ' + esc(debrief.outcome) + '</div>' +
    '</div>';

  html += '<div class="debrief-sections">';
  // Quality Metrics bars
  html += '<div class="debrief-section"><h3>Quality Metrics</h3>';
  html += metricBar('Compression Fraction', cf, 100, cf >= 80 ? 'var(--green)' : cf >= 60 ? 'var(--amber)' : 'var(--red)', cf + '%');
  if (ttfc !== null) {
    const ttfcPct = Math.min(100, (ttfc / 120) * 100);
    html += metricBar('Time to First Compression', ttfcPct, 100, ttfc <= 30 ? 'var(--green)' : ttfc <= 60 ? 'var(--amber)' : 'var(--red)', ttfc + 's');
  }
  html += metricBar('CPR Cycles', (m.cpr_cycle_count || 0), 10, 'var(--cyan)', (m.cpr_cycle_count || 0));
  html += metricBar('Shocks Delivered', (m.shock_count || 0), 5, 'var(--amber)', (m.shock_count || 0));
  html += '</div>';

  // What went well
  html += '<div class="debrief-section"><h3>What Went Well</h3><ul class="debrief-list good">';
  (debrief.what_went_well || []).slice(0, 8).forEach(function(w) {
    html += '<li>' + esc(w.replace(/^\d+s:\s*/, '')) + '</li>';
  });
  if ((debrief.what_went_well || []).length === 0) html += '<li style="color:var(--text-dim)">No specific strengths recorded</li>';
  html += '</ul></div>';

  // Areas for improvement
  html += '<div class="debrief-section"><h3>Areas for Improvement</h3><ul class="debrief-list bad">';
  (debrief.areas_for_improvement || []).slice(0, 8).forEach(function(a) {
    html += '<li>' + esc(a.replace(/^\d+s:\s*/, '')) + '</li>';
  });
  if ((debrief.areas_for_improvement || []).length === 0) html += '<li style="color:var(--text-dim)">No issues identified</li>';
  html += '</ul></div>';

  // Teaching points
  html += '<div class="debrief-section"><h3>Teaching Points</h3><ul class="debrief-list teach">';
  (debrief.teaching_points || []).forEach(function(t) { html += '<li>' + esc(t) + '</li>'; });
  html += '</ul></div>';
  html += '</div>';

  // Actions
  html += '<div class="debrief-actions">' +
    '<button class="debrief-btn" onclick="hideDebrief()">Back to Scenario</button>' +
    '<button class="debrief-btn" onclick="exportDebrief()">Export Card</button>' +
    '</div>';

  panel.innerHTML = html;
  panel.classList.add('visible');
}

function metricBar(label, value, max, color, display) {
  const pct = Math.min(100, (value / max) * 100);
  return '<div class="debrief-metric-bar">' +
    '<div class="bar-label"><span>' + label + '</span><span style="color:var(--white)">' + display + '</span></div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + ';box-shadow:0 0 6px ' + color + '"></div></div></div>';
}

function hideDebrief() {
  document.getElementById('debrief-panel').classList.remove('visible');
}

function exportDebrief() {
  // Copy debrief as text
  const panel = document.getElementById('debrief-panel');
  const text = panel.innerText;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      addToast(document.getElementById('feedback-bar'), 'Debrief copied to clipboard', 'good');
    });
  }
}

window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'context_update' && event.data.debrief) {

  }
});

function showStudentProgress(data) {
  if (!data) return;
  const panel = document.getElementById('progress-panel');

  let html = '<div class="progress-header">' +
    '<h2>Student: ' + esc(data.student_id) + '</h2>' +
    '<div class="progress-stats">' +
    '<div class="progress-stat"><div class="stat-val">' + data.total_scenarios + '</div><div class="stat-label">Sessions</div></div>' +
    '<div class="progress-stat"><div class="stat-val">' + Math.round((data.pass_rate || 0) * 100) + '%</div><div class="stat-label">Pass Rate</div></div>' +
    '</div></div>';

  html += '<div class="progress-charts">';

  // Compression Fraction trend
  if (data.metrics_over_time && data.metrics_over_time.compression_fraction) {
    html += '<div class="chart-card"><h3>Compression Fraction Over Time</h3>' +
      buildLineChart(data.metrics_over_time.compression_fraction, 0, 1, 'var(--cyan)', 0.8) + '</div>';
  }

  // Time to First Compression trend
  if (data.metrics_over_time && data.metrics_over_time.time_to_first_compression) {
    const ttfcData = data.metrics_over_time.time_to_first_compression.filter(function(v) { return v >= 0; });
    if (ttfcData.length > 0) {
      html += '<div class="chart-card"><h3>Time to First Compression</h3>' +
        buildLineChart(ttfcData, 0, 120, 'var(--amber)', 30) + '</div>';
    }
  }

  // Common errors
  if (data.common_errors && data.common_errors.length > 0) {
    html += '<div class="chart-card"><h3>Common Errors</h3>';
    const maxFreq = Math.max(...data.common_errors.map(function(e) { return e.frequency; }));
    data.common_errors.slice(0, 6).forEach(function(e) {
      const pct = (e.frequency / maxFreq) * 100;
      html += '<div class="debrief-metric-bar">' +
        '<div class="bar-label"><span style="font-size:10px">' + esc(e.error.substring(0, 40)) + '</span><span>' + e.frequency + 'x</span></div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:var(--red)"></div></div></div>';
    });
    html += '</div>';
  }

  // Weak areas
  if (data.weak_areas && data.weak_areas.length > 0) {
    html += '<div class="chart-card"><h3>Identified Weak Areas</h3><div class="weak-tags">';
    data.weak_areas.forEach(function(w) {
      html += '<span class="weak-tag">' + esc(w) + '</span>';
    });
    html += '</div></div>';
  }

  html += '</div>';
  html += '<div class="debrief-actions"><button class="debrief-btn" onclick="hideProgress()">Close</button></div>';

  panel.innerHTML = html;
  panel.classList.add('visible');
}

function buildLineChart(data, min, max, color, targetLine) {
  if (!data || data.length < 2) return '<div style="color:var(--text-dim);font-size:11px">Insufficient data</div>';
  const w = 280, h = 80, pad = 4;
  const range = max - min || 1;
  const points = data.map(function(v, i) {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = pad + (1 - (v - min) / range) * (h - pad * 2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');

  let svg = '<svg viewBox="0 0 ' + w + ' ' + h + '" style="height:80px">';
  // Target line
  if (targetLine != null) {
    const ty = pad + (1 - (targetLine - min) / range) * (h - pad * 2);
    svg += '<line x1="' + pad + '" y1="' + ty.toFixed(1) + '" x2="' + (w - pad) + '" y2="' + ty.toFixed(1) + '" stroke="var(--green)" stroke-width=".5" stroke-dasharray="4,3" opacity=".5"/>';
  }
  svg += '<polyline points="' + points + '" fill="none" stroke="' + color + '" stroke-width="1.5" stroke-linejoin="round"/>';
  // Data points
  data.forEach(function(v, i) {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = pad + (1 - (v - min) / range) * (h - pad * 2);
    svg += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="2" fill="' + color + '"/>';
  });
  svg += '</svg>';
  return svg;
}

function hideProgress() {
  document.getElementById('progress-panel').classList.remove('visible');
}

function advanceDemo(action) {
  if (demoStepIdx >= DEMO_SEQUENCE.length) return;
  const step = DEMO_SEQUENCE[demoStepIdx];
  if (step.trigger !== action) {
    // Wrong action in demo; still allow it
    // Find matching step anywhere
    const found = DEMO_SEQUENCE.findIndex((s, i) => i >= demoStepIdx && s.trigger === action);
    if (found >= 0) { demoStepIdx = found; } else return;
  }
  const entry = DEMO_SEQUENCE[demoStepIdx];
  // Merge patch
  const prev = demoStateSnapshot;
  for (const key in entry.patch) {
    if (key === 'vitals' || key === 'metrics') {
      demoStateSnapshot[key] = Object.assign({}, demoStateSnapshot[key], entry.patch[key]);
    } else {
      demoStateSnapshot[key] = entry.patch[key];
    }
  }
  if (entry.timelineEntry) {
    demoStateSnapshot.timeline = [...(demoStateSnapshot.timeline || []), entry.timelineEntry];
  }
  // Apply any timeline from patch
  if (entry.patch.timeline) {
    demoStateSnapshot.timeline = entry.patch.timeline;
  }
  demoStepIdx++;
  demoStateSnapshot.elapsed_sec = entry.patch.elapsed_sec || demoStateSnapshot.elapsed_sec;
  startTimestamp = Date.now() - demoStateSnapshot.elapsed_sec * 1000;
  updateDashboard(demoStateSnapshot);
}

// ── Init ────────────────────────────────────────────────
// Wait briefly for MCP messages, else start demo
let mcpReceived = false;
window.addEventListener('message', function onFirst(e) {
  if (e.data && e.data.type === 'context_update') {
    mcpReceived = true;
    window.removeEventListener('message', onFirst);
  }
});
setTimeout(() => {
  if (!mcpReceived) initDemo();
}, 800);
</script>
